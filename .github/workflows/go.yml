# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  benchmark:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    # Guards that parsing a large INSERT ... VALUES ('str1'), ('str2'), ...
    # statement (including nested-quote string literals) stays under 100ms.
    - name: Parse performance guard
      run: go test -v -run TestInsertManyTuplesPerf ./lyx/...

    # Reports throughput numbers for the same workload for visibility.
    - name: Benchmarks
      run: go test -run '^$' -bench 'BenchmarkInsert' -benchmem ./lyx/...
