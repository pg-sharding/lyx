version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused

  exclusions:
    generated: strict
    paths:
      - lyx/lexer\.go
    rules:
      # Table-driven tests share a single tcase struct; not all fields are
      # populated in every test case, so unused fields in _test.go are expected.
      - path: _test\.go
        linters:
          - unused
